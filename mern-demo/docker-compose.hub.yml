services:
  backend:
    image: trnhan0210/mern-backend:1.0
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      MONGODB_URI: ${MONGODB_URI:?Set the MONGODB_URI Codespaces secret before starting Compose}
    networks:
      default:
        aliases:
          - mern-backend


  frontend:
    image: trnhan0210/mern-frontend:1.0
    ports:
      - "5173:5173"
